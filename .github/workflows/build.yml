name: Compiler Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compiler avec PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --add-data "bm_prod.db;." app.py

    - name: Compiler avec PyInstaller (Mac)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconsole --onefile --add-data "bm_prod.db:." app.py

    - name: Sauvegarder l'exécutable généré
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.os }}
        path: dist/
