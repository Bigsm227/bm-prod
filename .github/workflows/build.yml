name: Compiler Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compiler avec PyInstaller pour Mac
      run: |
        pyinstaller --noconsole --onefile --name="BM_PROD" app.py

    - name: Sauvegarder l'application macOS
      uses: actions/upload-artifact@v4
      with:
        name: application-macos-catalina
        path: dist/BM_PROD.app
